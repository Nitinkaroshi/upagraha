    <rect x="84" y="0" width="50" height="11"/>
    <rect x="84" y="32" width="50" height="11"/>
    <rect x="123" y="0" width="11" height="43"/>
    <!-- A -->
    <rect x="152" y="0" width="11" height="80"/>
    <rect x="198" y="0" width="11" height="80"/>
    <rect x="152" y="0" width="57" height="11"/>
    <rect x="152" y="34" width="57" height="11"/>
    <!-- G -->
    <rect x="227" y="0" width="11" height="80"/>
    <rect x="227" y="0" width="58" height="11"/>
    <rect x="227" y="67" width="58" height="11"/>
    <rect x="274" y="34" width="11" height="46"/>
    <rect x="256" y="34" width="29" height="11"/>
    <!-- R -->
    <rect x="303" y="0" width="11" height="80"/>
    <rect x="303" y="0" width="51" height="11"/>
    <rect x="303" y="32" width="51" height="11"/>
    <rect x="343" y="0" width="11" height="43"/>
    <polygon points="324,43 335,43 354,80 343,80"/>
    <!-- A -->
    <rect x="368" y="0" width="11" height="80"/>
    <rect x="414" y="0" width="11" height="80"/>
    <rect x="368" y="0" width="57" height="11"/>
    <rect x="368" y="34" width="57" height="11"/>
    <!-- H -->
    <rect x="443" y="0" width="11" height="80"/>
    <rect x="497" y="0" width="11" height="80"/>
    <rect x="443" y="34" width="65" height="11"/>
    <!-- A -->
    <rect x="526" y="0" width="11" height="80"/>
    <rect x="572" y="0" width="11" height="80"/>
    <rect x="526" y="0" width="57" height="11"/>
    <rect x="526" y="34" width="57" height="11"/>
