  <!-- Tagline -->
  <text x="580" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.5" letter-spacing="3">SAFEGUARDING SPACE, SECURING THE FUTURE</text>

  <!-- Description -->
  <text x="580" y="410" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.7">Free space debris monitoring &amp; compliance tools</text>

  <!-- URL -->
  <text x="580" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" opacity="0.4">upagraha-ten.vercel.app</text>

  <!-- Thin accent line -->
  <line x1="580" y1="475" x2="1100" y2="475" stroke="#ffffff" stroke-width="1" opacity="0.1"/>

  <!-- Bottom row of feature pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#ffffff" opacity="0.6">
    <text x="580" y="510">⬢ Lifetime Calculator</text>
    <text x="780" y="510">⬢ Live Tracker</text>
    <text x="930" y="510">⬢ Deorbit Advisor</text>
    <text x="580" y="540">⬢ Sustainability Score</text>
    <text x="780" y="540">⬢ Conjunctions</text>
    <text x="930" y="540">⬢ Satellites Over You</text>
  </g>

  <!-- Free / Open Source / No Sign-up badges -->
  <g transform="translate(580, 570)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#ffffff" opacity="0.1"/>
    <text x="40" y="19" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">FREE</text>

