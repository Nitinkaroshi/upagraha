  <!-- Orbital rings -->
  <ellipse cx="280" cy="315" rx="210" ry="70" fill="none" stroke="#ffffff" stroke-width="2" transform="rotate(-25 280 315)" opacity="0.4"/>
  <ellipse cx="280" cy="315" rx="248" ry="45" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(15 280 315)" opacity="0.22"/>
  <ellipse cx="280" cy="315" rx="172" ry="86" fill="none" stroke="#ffffff" stroke-width="1" transform="rotate(-55 280 315)" opacity="0.15"/>

  <!-- Center dot -->
