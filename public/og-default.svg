  <circle cx="170" cy="265" r="3.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="425" cy="295" r="3" fill="#ffffff" opacity="0.65"/>
  <circle cx="365" cy="240" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="220" cy="385" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="450" cy="355" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- UPAGRAHA — block letters (matches the favicon style) -->
  <g fill="#ffffff" transform="translate(580, 240)">
    <!-- U -->
    <rect x="0" y="0" width="11" height="78"/>
    <rect x="55" y="0" width="11" height="78"/>
    <rect x="0" y="67" width="66" height="11"/>
    <!-- P -->
