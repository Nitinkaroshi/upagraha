<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Stars -->
  <circle cx="100" cy="80" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="220" cy="150" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="380" cy="60" r="1.2" fill="#ffffff" opacity="0.3"/>
  <circle cx="540" cy="120" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="720" cy="40" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="900" cy="100" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="1050" cy="70" r="1.2" fill="#ffffff" opacity="0.25"/>
  <circle cx="1130" cy="160" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="80" cy="430" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="280" cy="510" r="1.3" fill="#ffffff" opacity="0.2"/>
  <circle cx="560" cy="560" r="1.1" fill="#ffffff" opacity="0.3"/>
  <circle cx="850" cy="480" r="1.2" fill="#ffffff" opacity="0.3"/>
  <circle cx="1100" cy="540" r="1" fill="#ffffff" opacity="0.2"/>

  <!-- Earth on left -->
