    <text x="152" y="19" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">OPEN SOURCE</text>

    <rect x="224" y="0" width="120" height="28" rx="6" fill="#ffffff" opacity="0.1"/>
    <text x="284" y="19" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">NO SIGN-UP</text>
